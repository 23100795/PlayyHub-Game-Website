<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnowBliss Dash</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-image: url('https://tse2.mm.bing.net/th?id=OIP.eIforPxPPas-iUy5dfZ9HAHaEo&pid=Api&P=0&h=180');
            background-size: cover;
        }

        #gameArea {
            width: 100vw;
            height: 100vh;
            background-image: url('https://media1.giphy.com/media/3o6fISORwH1fcsQW0U/giphy.gif');
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        .player {
            width: 150px;
            height: 150px;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/b9/Snowman_illustration.png');
            background-repeat: no-repeat;
            background-size: contain;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Pure CSS/Emoji Snowflake (Guaranteed to show up) */
        .obstacle {
            width: 60px;
            height: 60px;
            font-size: 50px;
            line-height: 60px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 50%;
            user-select: none;
            filter: drop-shadow(0px 0px 5px #00e5ff);
        }

        #score {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 40px;
            font-weight: bold;
            color: rgb(81, 17, 201);
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 15px;
            border-radius: 10px;
        }

        .container {
    background-image: url('https://cdn.pixabay.com/animation/2022/12/01/02/22/02-22-03-942_512.gif'); 
    background-repeat: no-repeat;
    background-size: cover;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    padding: 30px;
    height: 550px;             /* Increased height */
    width: 90%;
    max-width: 950px;          /* Expanded max-width for widescreen layout */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
}

.container h2 {
    font-size: 64px;           /* Larger header title */
    color: pink;
    margin-bottom: 30px;
    font-family: Cambria, Georgia, serif;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
}

button {
    background-color: olivedrab;
    height: 75px;
    width: 220px;
    color: white;
    font-size: 36px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
}
        button:hover {
            background-color: #556b2f;
        }
    </style>
</head>
<body>

    <div id="gameArea" style="display:none;">
        <div id="score">Score: 0</div>
        <div class="player" id="player"></div>
        <div class="obstacle" id="obstacle">❄️</div>
    </div>

    <div class="container" id="container">
        <h2>SnowBliss Dash</h2>
        <button id="startButton">Start</button>
    </div>

    <script>
        const player = document.getElementById("player");
        const obstacle = document.getElementById("obstacle");
        const gameArea = document.getElementById("gameArea");
        const scoreElement = document.getElementById("score");
        const startButton = document.getElementById("startButton");
        const container = document.getElementById("container");

        let playerSpeed = 28;
        let obstacleSpeed = 4;
        let score = 0;
        let gameStarted = false;
        let currentLevel = 1;
        let animationFrameId = null;
        let obstaclePosition = 0;

        const levelSettings = [
            { playerSpeed: 28, obstacleSpeed: 4 },
            { playerSpeed: 28, obstacleSpeed: 6 },
            { playerSpeed: 28, obstacleSpeed: 8 },
            { playerSpeed: 28, obstacleSpeed: 10 },
            { playerSpeed: 28, obstacleSpeed: 12 }
        ];

        function setLevel(level) {
            const index = Math.min(level - 1, levelSettings.length - 1);
            playerSpeed = levelSettings[index].playerSpeed;
            obstacleSpeed = levelSettings[index].obstacleSpeed;
        }

        startButton.addEventListener("click", () => {
            gameArea.style.display = "block";
            container.style.display = "none";
            gameStarted = true;
            score = 0;
            currentLevel = 1;
            obstaclePosition = 0;
            scoreElement.innerText = "Score: 0";
            player.style.left = "50%";
            obstacle.style.left = Math.random() * (window.innerWidth - 80) + "px";
            setLevel(currentLevel);
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            moveObstacle();
        });

        document.addEventListener("keydown", (event) => {
            if (!gameStarted) return;
            let left = player.offsetLeft;
            if (event.key === "ArrowLeft" && left > 80) {
                player.style.left = (left - playerSpeed) + "px";
            }
            if (event.key === "ArrowRight" && left < window.innerWidth - 80) {
                player.style.left = (left + playerSpeed) + "px";
            }
        });

        function moveObstacle() {
            if (!gameStarted) return;

            obstaclePosition += obstacleSpeed;
            
            if (obstaclePosition > window.innerHeight) {
                obstaclePosition = -60;
                obstacle.style.left = Math.random() * (window.innerWidth - 80) + "px";
                score++;
                scoreElement.innerText = "Score: " + score;

                if (score % 10 === 0) {
                    currentLevel++;
                    setLevel(currentLevel);
                }
            }

            obstacle.style.top = obstaclePosition + "px";

            if (isCollision(player, obstacle)) {
                gameStarted = false;
                setTimeout(() => {
                    alert("Game Over! Score: " + score + " | Level: " + currentLevel);
                    resetGame();
                }, 10);
                return;
            }

            animationFrameId = requestAnimationFrame(moveObstacle);
        }

        function isCollision(player, obstacle) {
            const p = player.getBoundingClientRect();
            const o = obstacle.getBoundingClientRect();

            const playerBox = {
                left: p.left + 30,
                right: p.right - 30,
                top: p.top + 40,
                bottom: p.bottom - 10
            };

            const obstacleBox = {
                left: o.left + 10,
                right: o.right - 10,
                top: o.top + 10,
                bottom: o.bottom - 10
            };

            return (
                playerBox.left < obstacleBox.right &&
                playerBox.right > obstacleBox.left &&
                playerBox.top < obstacleBox.bottom &&
                playerBox.bottom > obstacleBox.top
            );
        }

        function resetGame() {
            gameStarted = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            container.style.display = "flex";
            gameArea.style.display = "none";
        }
    </script>
</body>
</html>
